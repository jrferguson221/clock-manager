name: Update weekly decisions

# Regenerates "Decisions of the week" from nflverse's play-by-play and FTN's charting, then commits the
# data. The deploy workflow runs after this one succeeds and publishes it.
on:
  schedule:
    # Tuesdays 13:17 UTC: after Monday night's game and nflverse's overnight update.
    - cron: "17 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-decisions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build the decisions data
        run: |
          # The NFL season runs into February, so January and February belong to the previous year's season.
          year=$(date -u +%Y); month=$(date -u +%-m)
          season=$(( month < 3 ? year - 1 : year ))
          bun scripts/decisions/build.ts --season "$season"
      # The tests read the new data, so a malformed or broken file stops here, before it's committed.
      - run: bun run test
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/decisions
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update decisions of the week"
            git push
          fi
