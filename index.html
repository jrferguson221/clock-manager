<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Situational Football</title>
  <meta name="theme-color" content="#1a2030">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%224%22 fill=%22%231a2030%22/%3E%3Ccircle cx=%2214%22 cy=%2232%22 r=%227%22 stroke=%22%23fff%22 stroke-width=%223.5%22 fill=%22none%22/%3E%3Cpath d=%22M30 14l9 9M39 14l-9 9%22 stroke=%22%23ff8a8c%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
  <!-- Mantine's ColorSchemeScript, inlined: set the color scheme before the first paint so dark mode doesn't flash light. -->
  <script>
    try {
      var stored = window.localStorage.getItem("mantine-color-scheme-value");
      var scheme = stored === "light" || stored === "dark" ? stored
        : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
